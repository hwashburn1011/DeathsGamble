<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Death's Gamble</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg2: #15151a;
    --ink: #e9e6df;
    --ink-dim: #8a8478;
    --accent: #c9a227;
    --danger: #b03030;
    --good: #4d8a52;
    --hood: #1a1a1f;
    --hood-light: #2a2a32;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background:
      radial-gradient(ellipse at 50% 0%, #1c1c22 0%, var(--bg) 60%) no-repeat,
      var(--bg);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
    user-select: none;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Screens ---------- */
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ---------- Title screen ---------- */
  #title-screen h1 {
    font-size: clamp(48px, 9vw, 120px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 0 24px rgba(201, 162, 39, 0.25);
    margin-bottom: 8px;
  }
  #title-screen .subtitle {
    color: var(--ink-dim);
    font-style: italic;
    margin-bottom: 36px;
    font-size: clamp(14px, 1.6vw, 18px);
  }

  /* ---------- Game screen ---------- */
  #game-screen {
    flex-direction: column;
    gap: 0;
  }
  #stage {
    position: relative;
    width: min(92vw, 720px);
    height: min(78vh, 720px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 5;
  }
  .hud-block {
    background: rgba(10, 10, 12, 0.7);
    border: 1px solid #2a2a32;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    letter-spacing: 0.05em;
    backdrop-filter: blur(2px);
  }
  .hud-block .label {
    color: var(--ink-dim);
    font-size: 11px;
    text-transform: uppercase;
    margin-right: 6px;
  }
  .hud-block .value { font-weight: bold; }
  .hud-block.hp .value { color: var(--danger); }
  .hud-block.gold .value { color: var(--accent); }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    padding: 14px 38px;
    font-size: 20px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s, color 0.15s, transform 0.05s;
  }
  .btn:hover { background: var(--accent); color: var(--bg); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    background: transparent;
    color: var(--accent);
  }

  /* ---------- Message banner ---------- */
  #banner {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10, 10, 12, 0.85);
    border: 1px solid #2a2a32;
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 16px;
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 5;
    text-align: center;
    min-width: 220px;
  }
  #banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #banner.good { border-color: var(--good); color: var(--good); }
  #banner.bad { border-color: var(--danger); color: var(--danger); }
  #banner.gold { border-color: var(--accent); color: var(--accent); }

  /* ---------- Spin button ---------- */
  #spin-btn {
    margin-top: 18px;
  }

  /* ---------- Game over ---------- */
  #gameover-screen h2 {
    font-size: clamp(40px, 7vw, 84px);
    letter-spacing: 0.12em;
    color: var(--danger);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  #gameover-screen .epitaph {
    color: var(--ink-dim);
    font-style: italic;
    margin-bottom: 28px;
    font-size: 16px;
  }
  #gameover-stats {
    display: flex;
    gap: 36px;
    margin-bottom: 36px;
  }
  #gameover-stats .stat {
    text-align: center;
  }
  #gameover-stats .stat .label {
    color: var(--ink-dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 6px;
  }
  #gameover-stats .stat .value {
    font-size: 36px;
    font-weight: bold;
    color: var(--accent);
  }

  .footer {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--ink-dim);
    font-size: 11px;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE SCREEN -->
  <div id="title-screen" class="screen active">
    <h1>Death's Gamble</h1>
    <p class="subtitle">Spin the wheel. Cheat the reaper. Or don't.</p>
    <button class="btn" id="start-btn">Start Game</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div id="stage">
      <div id="hud">
        <div class="hud-block hp"><span class="label">HP</span><span class="value" id="hp-value">3</span></div>
        <div class="hud-block gold"><span class="label">Gold</span><span class="value" id="gold-value">0</span></div>
        <div class="hud-block"><span class="label">Spins</span><span class="value" id="spins-value">0</span></div>
      </div>
      <canvas id="game-canvas" width="720" height="720"></canvas>
      <div id="banner"></div>
    </div>
    <button class="btn" id="spin-btn">Spin</button>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="gameover-screen" class="screen">
    <h2>You Lost the Bet</h2>
    <p class="epitaph" id="epitaph">Death always collects.</p>
    <div id="gameover-stats">
      <div class="stat"><span class="label">Spins Survived</span><span class="value" id="final-spins">0</span></div>
      <div class="stat"><span class="label">Gold Won</span><span class="value" id="final-gold">0</span></div>
    </div>
    <button class="btn" id="retry-btn">Try Again</button>
  </div>

  <div class="footer">Click SPIN — beware the skull.</div>
</div>

<script>
'use strict';

// ============== Game state ==============
const state = {
  hp: 3,
  maxHp: 5,
  gold: 0,
  spins: 0,
  bonusSpins: 0,
  spinning: false,
  wheelAngle: 0,        // current rotation in radians
  spinTarget: 0,        // target rotation
  spinStart: 0,         // angle at start of current spin
  spinStartTime: 0,
  spinDuration: 0,
  pendingResolve: null,
};

// ============== Wheel definition ==============
// 12 segments. Arrow points DOWN at the TOP of the wheel.
// In canvas, angle 0 = right (3 o'clock); -PI/2 = top.
// We compute which segment lies under the top pointer based on wheelAngle.
const SEGMENTS = [
  { type: 'gold',      label: '+10',   color: '#c9a227', amount: 10, weight: 'common' },
  { type: 'heal',      label: '+1 HP', color: '#4d8a52', amount: 1 },
  { type: 'gold',      label: '+10',   color: '#c9a227', amount: 10 },
  { type: 'damage',    label: '-1 HP', color: '#7a3030', amount: 1 },
  { type: 'gold',      label: '+25',   color: '#d4b347', amount: 25 },
  { type: 'bonus',     label: 'AGAIN', color: '#5a5ab0', amount: 1 },
  { type: 'gold',      label: '+10',   color: '#c9a227', amount: 10 },
  { type: 'damage',    label: '-1 HP', color: '#7a3030', amount: 1 },
  { type: 'jackpot',   label: '+100',  color: '#e6c34a', amount: 100 },
  { type: 'heal',      label: '+1 HP', color: '#4d8a52', amount: 1 },
  { type: 'gold',      label: '+10',   color: '#c9a227', amount: 10 },
  { type: 'death',     label: 'SKULL', color: '#1a1a1a', amount: 0 },
];
const SEGMENT_COUNT = SEGMENTS.length;
const SEG_ANGLE = (Math.PI * 2) / SEGMENT_COUNT;

// ============== Canvas ==============
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

// Match canvas backing pixels to display size with DPR for crisp drawing.
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

// ============== Drawing ==============
function drawDeath(cx, cy, scale) {
  // A blocky hooded reaper, behind the wheel. Matches the pencil sketch.
  const s = scale;
  ctx.save();
  ctx.translate(cx, cy);

  // Body silhouette (rounded mound under hood)
  ctx.fillStyle = '#1a1a1f';
  ctx.beginPath();
  ctx.moveTo(-180 * s, 320 * s);
  ctx.bezierCurveTo(-200 * s, 60 * s, -150 * s, -50 * s, 0 * s, -60 * s);
  ctx.bezierCurveTo(150 * s, -50 * s, 200 * s, 60 * s, 180 * s, 320 * s);
  ctx.closePath();
  ctx.fill();

  // Hood drape (slightly lighter so it reads against body)
  ctx.fillStyle = '#22222a';
  ctx.beginPath();
  ctx.moveTo(-140 * s, 80 * s);
  ctx.bezierCurveTo(-160 * s, -40 * s, -110 * s, -130 * s, 0 * s, -150 * s);
  ctx.bezierCurveTo(110 * s, -130 * s, 160 * s, -40 * s, 140 * s, 80 * s);
  ctx.closePath();
  ctx.fill();

  // Head (boxy, tilted)
  ctx.save();
  ctx.rotate(-0.08);
  ctx.fillStyle = '#2a2a32';
  ctx.fillRect(-70 * s, -150 * s, 140 * s, 130 * s);
  // Eyes
  ctx.fillStyle = '#0a0a0c';
  ctx.beginPath();
  ctx.arc(-26 * s, -100 * s, 7 * s, 0, Math.PI * 2);
  ctx.arc(26 * s, -100 * s, 7 * s, 0, Math.PI * 2);
  ctx.fill();
  // Mouth (small dark square)
  ctx.fillRect(-12 * s, -55 * s, 24 * s, 18 * s);
  ctx.restore();

  ctx.restore();
}

function drawWheel(cx, cy, radius) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(state.wheelAngle);

  // Segment slices
  for (let i = 0; i < SEGMENT_COUNT; i++) {
    const seg = SEGMENTS[i];
    const start = i * SEG_ANGLE - SEG_ANGLE / 2;
    const end = start + SEG_ANGLE;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = '#0a0a0c';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.rotate(start + SEG_ANGLE / 2);
    ctx.translate(radius * 0.66, 0);
    ctx.fillStyle = (seg.type === 'death') ? '#c9a227' : '#0a0a0c';
    ctx.font = `bold ${Math.round(radius * 0.09)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(seg.label, 0, 0);
    ctx.restore();
  }

  // Outer rim
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#15151a';
  ctx.stroke();

  // Inner hub
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0a0c';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#c9a227';
  ctx.stroke();

  ctx.restore();
}

function drawPointer(cx, cy, radius) {
  // Down-pointing arrow at the top of the wheel.
  ctx.save();
  ctx.fillStyle = '#c9a227';
  ctx.strokeStyle = '#0a0a0c';
  ctx.lineWidth = 2;
  const tipY = cy - radius + 14;
  const baseY = cy - radius - 22;
  const halfW = 16;
  ctx.beginPath();
  ctx.moveTo(cx, tipY);
  ctx.lineTo(cx - halfW, baseY);
  ctx.lineTo(cx + halfW, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function render() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  ctx.clearRect(0, 0, w, h);

  // Subtle ground line
  ctx.fillStyle = '#0a0a0c';
  ctx.fillRect(0, h * 0.86, w, 4);

  // Death sits behind the wheel
  const cx = w / 2;
  const cy = h * 0.55;
  const scale = Math.min(w, h) / 720;

  drawDeath(cx, cy + 20 * scale, scale);

  // Wheel
  const wheelRadius = Math.min(w, h) * 0.32;
  drawWheel(cx, cy + wheelRadius * 0.05, wheelRadius);

  // Pointer
  drawPointer(cx, cy + wheelRadius * 0.05, wheelRadius);
}

// ============== Spin loop ==============
function startSpin() {
  if (state.spinning) return;
  if (state.bonusSpins > 0) {
    state.bonusSpins--;
  }
  state.spinning = true;
  spinBtn.disabled = true;
  hideBanner();

  // Pick a random target segment.
  const targetSeg = Math.floor(Math.random() * SEGMENT_COUNT);

  // Angle that puts segment `i` under the top pointer:
  //   For un-rotated wheel, segment i's center is at angle  i * SEG_ANGLE.
  //   The pointer is at angle -PI/2 (top).
  //   We need wheelAngle such that:  (i * SEG_ANGLE + wheelAngle) ≡ -PI/2  (mod 2π)
  //   => wheelAngle = -PI/2 - i * SEG_ANGLE
  const baseTarget = -Math.PI / 2 - targetSeg * SEG_ANGLE;

  // Add several full rotations and a tiny random offset within the segment.
  const fullRotations = 5 + Math.floor(Math.random() * 3); // 5–7 spins
  const jitter = (Math.random() - 0.5) * SEG_ANGLE * 0.7;
  const total = baseTarget + fullRotations * Math.PI * 2 + jitter;

  // Normalize so we always spin forward from the current angle.
  state.spinStart = state.wheelAngle;
  // Bring `total` to be > current angle.
  let target = total;
  while (target < state.wheelAngle + Math.PI * 4) target += Math.PI * 2;
  state.spinTarget = target;

  state.spinStartTime = performance.now();
  state.spinDuration = 4200 + Math.random() * 600;

  state.pendingResolve = targetSeg;
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function tick(now) {
  if (state.spinning) {
    const elapsed = now - state.spinStartTime;
    const t = Math.min(1, elapsed / state.spinDuration);
    const eased = easeOutCubic(t);
    state.wheelAngle = state.spinStart + (state.spinTarget - state.spinStart) * eased;

    if (t >= 1) {
      state.spinning = false;
      // Normalize angle to keep numbers small.
      state.wheelAngle = ((state.wheelAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      resolveSpin(state.pendingResolve);
    }
  }

  render();
  requestAnimationFrame(tick);
}

// ============== Resolve outcome ==============
function resolveSpin(segIdx) {
  state.spins++;
  spinsValue.textContent = state.spins;

  const seg = SEGMENTS[segIdx];
  switch (seg.type) {
    case 'gold':
      state.gold += seg.amount;
      flashBanner(`+${seg.amount} Gold`, 'gold');
      break;
    case 'jackpot':
      state.gold += seg.amount;
      flashBanner(`JACKPOT! +${seg.amount} Gold`, 'gold');
      break;
    case 'heal':
      if (state.hp < state.maxHp) {
        state.hp += seg.amount;
        flashBanner(`+${seg.amount} HP`, 'good');
      } else {
        state.gold += 5;
        flashBanner('Already full — +5 Gold', 'good');
      }
      break;
    case 'damage':
      state.hp -= seg.amount;
      flashBanner(`-${seg.amount} HP`, 'bad');
      break;
    case 'bonus':
      state.bonusSpins++;
      flashBanner('Free Spin!', 'good');
      break;
    case 'death':
      state.hp = 0;
      flashBanner('THE SKULL', 'bad');
      break;
  }

  hpValue.textContent = state.hp;
  goldValue.textContent = state.gold;

  if (state.hp <= 0) {
    setTimeout(() => endGame(seg.type === 'death'), 1100);
  } else {
    spinBtn.disabled = false;
    spinBtn.textContent = state.bonusSpins > 0 ? `Spin (${state.bonusSpins} free)` : 'Spin';
  }
}

// ============== UI helpers ==============
const banner = document.getElementById('banner');
let bannerTimeout = null;
function flashBanner(text, kind) {
  banner.textContent = text;
  banner.className = 'show ' + (kind || '');
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(() => {
    banner.classList.remove('show');
  }, 1400);
}
function hideBanner() {
  banner.classList.remove('show');
}

// ============== Screens ==============
const titleScreen = document.getElementById('title-screen');
const gameScreen = document.getElementById('game-screen');
const gameoverScreen = document.getElementById('gameover-screen');

const hpValue = document.getElementById('hp-value');
const goldValue = document.getElementById('gold-value');
const spinsValue = document.getElementById('spins-value');
const spinBtn = document.getElementById('spin-btn');

function showScreen(el) {
  [titleScreen, gameScreen, gameoverScreen].forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function startGame() {
  state.hp = 3;
  state.gold = 0;
  state.spins = 0;
  state.bonusSpins = 0;
  state.wheelAngle = 0;
  state.spinning = false;
  hpValue.textContent = state.hp;
  goldValue.textContent = state.gold;
  spinsValue.textContent = state.spins;
  spinBtn.disabled = false;
  spinBtn.textContent = 'Spin';
  showScreen(gameScreen);
  resizeCanvas();
}

const EPITAPHS = [
  'Death always collects.',
  'The wheel turns; the reaper waits.',
  'A poor wager.',
  'You should have stopped at the gold.',
  'The skull was always coming.',
];

function endGame(killedBySkull) {
  document.getElementById('final-spins').textContent = state.spins;
  document.getElementById('final-gold').textContent = state.gold;
  document.getElementById('epitaph').textContent =
    killedBySkull ? 'You drew the skull.' : EPITAPHS[Math.floor(Math.random() * EPITAPHS.length)];
  showScreen(gameoverScreen);
}

// ============== Wire up ==============
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
spinBtn.addEventListener('click', startSpin);

// Spacebar to spin
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && gameScreen.classList.contains('active') && !state.spinning) {
    e.preventDefault();
    startSpin();
  }
});

// Boot
resizeCanvas();
requestAnimationFrame(tick);
</script>
</body>
</html>
